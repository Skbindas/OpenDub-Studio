[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendub-studio"
version = "0.1.0"
description = "Local-first open-source AI dubbing studio"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "pydantic>=2.11,<3.0",
  "httpx>=0.27,<1.0",
  "python-dotenv>=1.0,<2.0",
  "numpy>=1.26,<3.0",
  "soundfile>=0.13,<1.0",
  "scipy>=1.14,<2.0",
]

[tool.setuptools]
packages = ["backend"]
