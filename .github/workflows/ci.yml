name: OpenDub Studio CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Rubber Band for media integration tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg librubberband2
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install CPU PyTorch for waveform integration tests
        run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify system dependencies
        run: python scripts/check_dependencies.py
      - name: Compile Python
        run: python -m compileall -q backend scripts
      - name: Run test suite
        run: python -m pytest -v -W error::DeprecationWarning -k "not feature_length"
      - name: Validate frontend JavaScript
        if: always()
        run: node --check web/app.js && node --check web/diagnostics.js && node --check web/studio.js && node --check web/voice-library.js && node --check web/speaker-workflow.js && node --check web/compute.js && node --check web/setup.js
      - name: Verify review, measured progress and casting behavior
        run: node --test tests/test_studio_frontend.cjs tests/test_public_alpha_frontend.cjs
